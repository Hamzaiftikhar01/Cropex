<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CropMedic AI — Smart Crop Disease Diagnosis & Treatment Assistant</title>
    <meta name="description" content="CropMedic AI is a professional, AI-powered agricultural tool that identifies crop diseases from leaf images and provides immediate treatment, prevention recommendations, and best farming practices." />
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CropMedic AI — Smart Crop Disease Diagnosis" />
    <meta property="og:description" content="Upload a leaf photo for instant offline crop diagnostics, trusted chemical solutions, and prevention actions." />
    <meta property="og:image" content="/favicon.svg" />
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="CropMedic AI — Smart Crop Disease Diagnosis" />
    <meta property="twitter:description" content="Upload a leaf photo for instant offline crop diagnostics, trusted chemical solutions, and prevention actions." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Applies the theme before first paint; React sets this class in an effect,
      // which would otherwise flash light before switching to the dark default.
      try {
        var stored = localStorage.getItem('cropcare_dark_mode');
        if (stored === null || stored === 'true') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
